---
layout: default
---
<article class="post">
  <header class="post-header">
    <p class="eyebrow post-kicker">
      {% if page.lang == 'zh' %}
        {{ page.date | date: "%Y-%m-%d" }}
      {% else %}
        {{ page.date | date: "%B %d, %Y" }}
      {% endif %}
    </p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="deck">{{ page.description }}</p>
    {% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>

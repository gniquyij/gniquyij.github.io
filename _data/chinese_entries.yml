  description: >-
    今早往昨晚的牛腩里下了点白萝卜和面条，用老抽上了个色，最后撒上黑胡椒。不管是闻起来还是吃上去，是记忆里康帅傅黑椒/红烧牛肉面的味道。一直以来觉得方便面的诱人是现实中不存在的（为了“更好吃”会大改成分比例），是我阴谋论了。

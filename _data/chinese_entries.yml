- date: 2024-05-03
  title: 我的暴食
  url: https://mp.weixin.qq.com/s/ymw42LLMa_ginBmibwxf3Q
  tag: 写作
  external: true
  description: >-
    个人情况小结。有类似情况的朋友觉得失控及时看医生，心理医生精神科医生躯体症状按需找医生。如果这个帖子能助你自助，我的荣幸也替你高兴。年初经历了波暴食症状，比如“健康”早午饭的情况下晚上刚开始决定少吃不吃，晚十一点不饿但馋到发狂一两小时内连吃十个冻三明治，馅是厚涂花生酱夹芝士，吃到第三四个已经饱了但没法控制自己直到吃空冰箱，第二天人肿肿到下肢水肿按下有坑。
